<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>门户收录</title>
    <link rel="stylesheet" href="../styles/paper.css" />
  </head>
  <body class="popup">
    <!--
      THESIS: 收录窗按 Raindrop 的左右结构排，拒绝堆叠表单和蓝填充按钮。
      OWN-WORLD: 白日档案纸、墨与灰；金只作线、点、环与焦点；系统无衬线。
      STORY: 未配置只剩一句话和「去选项」；配好后标题是主信息，标签在左，保存右下。
      FIRST VIEWPORT: 顶栏标明收录或改写；左列短标签；右列站点图标与标题、次行描述、退后的 URL；有绑定时左下「删除」，右下「保存」。
      FORM: Raindrop 结构 + Archive Paper，brief-pinned，未跑 concept-seed。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <section id="gate" class="gate" hidden>
      <p>先在选项里填写仓库和凭证，才能把当前页写进门户源。</p>
      <button type="button" class="text-action" id="go-options">去选项</button>
    </section>
    <form id="capture" class="capture" hidden>
      <header class="mode" id="mode">收录</header>
      <div class="capture-grid" id="capture-grid">
        <div class="tags" id="tag-column">
          <ul class="tag-list" id="tags"></ul>
          <div class="tag-picker" id="tag-picker">
            <button
              type="button"
              class="tag-add"
              id="tag-add"
              aria-label="添加标签"
              aria-describedby="tag-error"
              aria-expanded="false"
              aria-controls="tag-menu"
            >
              添加
            </button>
            <div class="tag-menu" id="tag-menu" hidden>
              <ul
                class="tag-choices"
                id="tag-choices"
                aria-label="已有标签"
              ></ul>
              <button type="button" class="tag-create-open" id="tag-create-open">
                新建
              </button>
              <div class="tag-create" id="tag-create" hidden>
                <input
                  id="tag-create-name"
                  aria-label="新标签"
                  aria-describedby="tag-create-error"
                  placeholder="名字"
                  spellcheck="false"
                  autocomplete="off"
                />
                <p class="field-error" id="tag-create-error" hidden></p>
                <button type="button" class="text-action" id="tag-create-confirm">
                  确认
                </button>
              </div>
            </div>
          </div>
          <p class="field-error tag-error" id="tag-error" aria-live="polite" hidden></p>
        </div>
        <div class="main">
          <div class="title-row">
            <span class="favicon-slot" id="favicon-slot" hidden></span>
            <div class="title-field">
              <input
                id="title"
                name="title"
                aria-label="标题"
                aria-describedby="title-error"
                spellcheck="false"
                autocomplete="off"
                required
              />
              <p class="field-error" id="title-error" hidden></p>
            </div>
          </div>
          <button type="button" class="desc-line" id="desc-line">
            添加描述
          </button>
          <textarea
            id="description"
            name="description"
            aria-label="描述"
            rows="3"
            hidden
          ></textarea>
          <input
            id="url"
            name="url"
            aria-label="URL"
            aria-describedby="url-error"
            spellcheck="false"
            autocomplete="off"
            type="url"
            required
          />
          <p class="field-error" id="url-error" hidden></p>
        </div>
      </div>
      <footer class="actions">
        <button type="button" class="text-action delete" id="delete" hidden>
          删除
        </button>
        <p id="status" role="status" aria-live="polite"></p>
        <button type="submit" class="text-action save" id="save" disabled>
          保存
        </button>
      </footer>
    </form>
    <script src="../build/popup.js"></script>
  </body>
</html>
